services:
  - type: web
    name: urban-chic-admin
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend_admin.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: urban-chic-store
    env: static
    buildCommand: echo "Static build complete"
    staticPublishPath: ./frontend_khachhang

